<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hokkien Tangliengim IME Pad</title>
    <meta
      name="description"
      content="A browser-based Hokkien Tangliengim IME pad for typing Tangliengim Hangul and Hanri."
    >
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="styles.css?v=20260906-icon-tools">
  </head>
  <body>
    <main class="ime-shell">
      <header class="ime-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">東<br><span>롕</span></span>
          <div>
            <p class="eyebrow">Hokkien Tangliengim</p>
            <h1>IME Pad</h1>
          </div>
        </div>
        <a class="dictionary-link" href="/dictionary/">Dictionary</a>
      </header>

      <section class="pad" aria-label="Hokkien Tangliengim IME Pad">
        <label class="pad-label" for="imeText">Hanri + Hangul</label>
        <div class="text-wrap">
          <textarea
            id="imeText"
            class="ime-text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Type here..."
            autofocus
          ></textarea>
          <button id="clearButton" class="clear-button" type="button" aria-label="Clear text">×</button>
        </div>

        <div id="candidateBar" class="candidate-bar" aria-label="Hanri candidates" hidden></div>

        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="copyButton" class="tool-button copy-tool" type="button" aria-label="Copy text" title="Copy text">
              <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24">
                <rect x="8" y="8" width="12" height="12" rx="1.5"></rect>
                <path d="M4 16V4h12"></path>
              </svg>
            </button>
            <button id="audioButton" class="tool-button audio-tool" type="button" aria-label="Play audio" title="Listen">
              <svg class="tool-icon audio-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
              </svg>
              <svg class="tool-icon stop-icon" aria-hidden="true" viewBox="0 0 24 24">
                <rect x="7" y="7" width="10" height="10" rx="1"></rect>
              </svg>
            </button>
          </div>
          <div class="sandhi-control" role="group" aria-label="Sandhi mode">
            <span class="sandhi-label">Sandhi:</span>
            <button id="taipeiButton" class="sandhi-button active" type="button" aria-pressed="true">Taipei</button>
            <button id="singaporeButton" class="sandhi-button" type="button" aria-pressed="false">Singapore</button>
          </div>
          <span id="statusLine" class="status-line">Loading dictionary...</span>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/dictionary/web-hangul-ime.js?v=20260901-mobile-ime"></script>
    <script src="/dictionary/web-ime-core.js?v=20260906-shared-ime"></script>
    <script src="ime.js?v=20260906-singapore-audio"></script>
  </body>
</html>
