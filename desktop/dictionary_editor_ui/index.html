<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="editor-token" content="__EDITOR_TOKEN__">
  <title>Tangliengim Dictionary Editor</title>
  <link rel="stylesheet" href="/ime/styles.css">
  <link rel="stylesheet" href="/shared/web-ime-menu.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="editor-header">
    <a class="brand" href="/ime/" target="_blank" aria-label="Open IME pad">
      <span class="brand-mark" aria-hidden="true">東<br><span>롕</span></span>
      <div><p class="eyebrow">Hokkien Tangliengim</p><h1>Dictionary Editor</h1></div>
    </a>
    <div class="header-actions"><span id="publishState" class="publish-state">Local dictionary</span><button id="publishButton" class="primary" type="button">Publish updates</button></div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main class="editor-layout">
    <section class="entries" aria-label="Dictionary entries">
      <div class="entry-toolbar">
        <input id="search" type="search" placeholder="Search entries, readings or meanings" aria-label="Search entries" autocomplete="off">
        <button id="reloadButton" type="button">Reload</button>
      </div>
      <div class="entry-filters">
        <select id="typeFilter" aria-label="Entry type"><option value="">All types</option><option value="lexical">Words</option><option value="hangul_override">Hangul overrides</option><option value="correction_alias">Corrections</option><option value="number_pronunciation">Numbers</option></select>
        <select id="categoryFilter" aria-label="Category"><option value="">All categories</option></select>
        <span id="entryCount" class="muted">Loading entries...</span>
        <button id="batchButton" type="button">Batch import</button>
        <button id="newButton" type="button">New entry</button>
      </div>
      <div class="entry-table-wrap">
        <table class="entry-table"><thead><tr><th>Headword</th><th>Reading</th><th>English</th></tr></thead><tbody id="entryRows"></tbody></table>
        <p id="empty" class="empty" hidden>No matching entries</p>
      </div>
      <nav class="pagination" aria-label="Entry pages"><button id="previous" type="button" aria-label="Previous page">Previous</button><span id="pageLabel"></span><button id="next" type="button" aria-label="Next page">Next</button></nav>
    </section>
    <section class="entry-detail" aria-labelledby="formTitle">
      <div class="detail-heading"><h2 id="formTitle">New entry</h2><span id="unsaved" class="muted" hidden>Unsaved changes</span></div>
      <p id="saveFeedback" class="save-feedback" role="status" aria-live="polite" hidden></p>
      <form id="entryForm">
        <label for="hanri">Hanri / headword</label>
        <div class="input-wrap"><input id="hanri" name="hanri" class="script" required autocomplete="off" spellcheck="false"><div id="headwordCandidates" class="candidate-bar hanri-candidate-menu" hidden></div></div>
        <div class="field-heading"><label for="reading">Hangul reading</label><label class="check-label"><input id="keyboard" type="checkbox" checked> Hangul keyboard</label></div>
        <div class="input-wrap"><input id="reading" name="reading" class="script" required autocomplete="off" spellcheck="false"><div id="readingCandidates" class="candidate-bar hanri-candidate-menu" hidden></div></div>
        <label for="english">English</label><textarea id="english" name="english" rows="2"></textarea>
        <label for="mandarin_trad">Mandarin (Traditional)</label><input id="mandarin_trad" name="mandarin_trad" class="script" autocomplete="off">
        <fieldset id="categories"><legend>Categories</legend><div id="categoryChoices" class="category-choices"></div></fieldset>
        <details id="advanced"><summary>Additional fields</summary><div class="advanced-fields">
          <label for="simplified">Hokkien (Simplified)</label><input id="simplified" name="simplified" class="script" autocomplete="off">
          <label for="mandarin_simp">Mandarin (Simplified)</label><input id="mandarin_simp" name="mandarin_simp" class="script" autocomplete="off">
          <label for="entry_type">Entry type</label><select id="entry_type" name="entry_type"><option value="">Automatic</option><option value="lexical">Word</option><option value="hangul_override">Hangul override</option><option value="correction_alias">Correction alias</option><option value="number_pronunciation">Number pronunciation</option></select>
          <label for="corrected">Corrected reading</label><input id="corrected" name="corrected" class="script" autocomplete="off">
          <label for="entry_id">Entry ID</label><input id="entry_id" name="entry_id" readonly>
        </div></details>
        <div class="form-actions"><button id="previewButton" type="button">Preview</button><button id="saveButton" class="primary" type="submit">Save locally</button></div>
      </form>
      <section id="preview" class="preview" aria-label="Entry preview" hidden>
        <div class="preview-top"><h3 id="previewHeadword" class="script"></h3><button id="listen" type="button">Listen</button></div>
        <p id="previewReading" class="script"></p><p id="previewRoman"></p><p id="previewEnglish"></p><p id="audioMissing" class="muted"></p>
      </section>
    </section>
  </main>
  <footer><span id="sourcePath"></span><span>© 2026 Zhen Dong Woo. All rights reserved.</span></footer>
  <dialog id="batchDialog" class="batch-dialog" aria-labelledby="batchTitle">
    <div class="dialog-heading"><h2 id="batchTitle">Batch import</h2><button id="closeBatch" type="button" aria-label="Close batch import">Close</button></div>
    <label for="batchText">Paste TSV: headword, reading, English, Mandarin (Traditional)</label>
    <textarea id="batchText" rows="7" spellcheck="false" wrap="off" placeholder="Hanri&#9;Hangul reading&#9;English&#9;Mandarin"></textarea>
    <div class="dialog-actions"><button id="parseBatch" type="button">Review entries</button><button id="saveBatch" class="primary" type="button" disabled>Save batch locally</button></div>
    <p id="batchStatus" role="status"></p><div class="batch-table-wrap"><table id="batchTable" hidden><thead><tr><th>Headword</th><th>Reading</th><th>English</th><th>Mandarin</th><th></th></tr></thead><tbody id="batchRows"></tbody></table></div>
  </dialog>
  <dialog id="conflictDialog" class="conflict-dialog" aria-labelledby="conflictTitle">
    <h2 id="conflictTitle">Resolve dictionary changes</h2><form id="conflictForm"><div id="conflicts"></div><div class="dialog-actions"><button id="cancelConflicts" type="button">Keep saved locally</button><button type="submit" class="primary">Publish selected values</button></div></form>
  </dialog>
  <script src="/shared/web-hangul-ime.js"></script>
  <script src="/shared/web-ime-core.js"></script>
  <script src="/shared/web-audio-player.js"></script>
  <script src="editor.js"></script>
</body>
</html>
