<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="editor-token" content="__EDITOR_TOKEN__">
  <title>Lyric Timing · Local Website Editor</title>
  <link rel="stylesheet" href="website-editor.css">
  <link rel="stylesheet" href="lyric-timing.css">
  <link rel="stylesheet" href="/shared/web-ime-menu.css">
  <script src="/shared/web-lyric-player.js" defer></script>
  <script src="lyric-companion.js" defer></script>
  <script src="/shared/web-hangul-ime.js" defer></script>
  <script src="/shared/web-ime-core.js" defer></script>
  <script src="lyric-timing.js" defer></script>
</head>
<body>
  <header class="cms-header"><div><span class="local-badge">Local only</span><h1 id="timingTitle">Lyric timing</h1></div><nav class="editor-header-links" aria-label="Editor navigation"><a class="editor-hub-link" href="/editors/">← Editors</a><a href="/website-editor/">Website Editor</a></nav></header>
  <div class="timing-actions">
    <div id="songSearchBox" class="song-search-box">
      <label for="songSearch">Search songs<input id="songSearch" type="search" placeholder="Search songs..." autocomplete="off" spellcheck="false" aria-controls="songSearchCandidates" aria-autocomplete="list"></label>
      <div id="songSearchCandidates" class="hanri-candidate-menu" role="listbox" aria-label="TLI candidates" hidden></div>
    </div>
    <button id="songHangulToggle" class="keyboard-toggle" type="button" aria-pressed="true"><span>TLI Hangul keyboard</span><span class="switch-track" aria-hidden="true"></span></button>
    <span id="songSearchCount" role="status" aria-live="polite"></span>
    <span id="songImeStatus" role="status" aria-live="polite">Loading TLI candidates...</span>
    <label>Song<select id="songChoice" aria-label="Choose song"><option value="">Loading songs...</option></select></label>
    <label>Status<select id="timingStatus"><option value="draft">Draft</option><option value="reviewed">Reviewed</option></select></label>
    <span id="completion"></span><button id="reloadTiming">Reload</button><button id="saveTiming" class="primary" disabled>Save timings locally</button>
  </div>
  <p id="timingNotice" role="status" aria-live="polite">Loading song…</p>
  <main class="timing-workspace">
    <section class="timing-player" aria-label="Timing player">
      <div class="playback-options">
        <button id="openYoutube" disabled>Open YouTube window</button>
        <button id="togglePlayback" disabled aria-label="Play video" title="Play video">▶</button>
        <a href="youtube-setup.html" target="_blank" rel="noopener">Companion setup</a>
      </div>
      <div class="clock-row"><output id="clock">00:00.000</output><span id="playerState">Waiting for YouTube</span></div>
      <input id="playbackSeek" class="playback-seek" type="range" min="0" max="0" step="0.001" value="0" disabled aria-label="Video playback position">
      <div class="timing-commands"><button id="markStart" disabled title="Mark the selected sentence's start at the current video time">Mark start</button><button id="markEnd" disabled title="Mark the selected sentence's end at the current video time">Mark end</button><button id="seekStart" disabled title="Seek to the selected sentence's start">Go to start</button><button id="clearCue" disabled>Clear times</button><button id="undoTiming" disabled aria-label="Undo timing edit" title="Undo timing edit">↶</button></div>
      <label class="advance-option"><input id="advanceAfterEnd" type="checkbox" checked> Advance after marking end</label>
      <label class="advance-option"><input id="previewHighlight" type="checkbox" checked> Highlight preview</label>
      <iframe id="lyricPreview" title="Selected lyric preview" sandbox="allow-same-origin allow-scripts"></iframe>
    </section>
    <section class="timing-lines" aria-label="Sentences">
      <div class="timing-column-labels"><span>Sentence</span><span>Start</span><span>End</span></div>
      <div id="cueRows"></div>
    </section>
  </main>
</body>
</html>
