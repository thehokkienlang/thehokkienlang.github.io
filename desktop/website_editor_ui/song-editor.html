<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="editor-token" content="__EDITOR_TOKEN__">
  <title>Song Editor · Tangliengim</title>
  <link rel="stylesheet" href="website-editor.css">
  <link rel="stylesheet" href="/shared/web-ime-menu.css">
  <link rel="stylesheet" href="song-editor.css">
  <script src="/shared/web-hangul-ime.js" defer></script>
  <script src="/shared/web-ime-core.js" defer></script>
  <script src="/shared/web-phonetic-output.js" defer></script>
  <script src="/website-editor/vendor/pinyin-pro.js" defer></script>
  <script src="song-editor.js" defer></script>
</head>
<body>
  <header class="cms-header">
    <div class="identity"><span class="identity-mark" aria-hidden="true">東<br><b>롕</b></span><div><span>THEHOKKIENLANG</span><h1>Song Editor</h1></div></div>
    <div class="header-status"><a class="editor-hub-link" href="/editors/">← Editors</a><a class="editor-hub-link" href="/website-editor/">Website Editor</a><span class="local-badge">Local only</span><button id="refreshSongDictionary" type="button">Refresh dictionary</button></div>
  </header>
  <div id="songNotice" class="notice" role="status" aria-live="polite" hidden></div>
  <section class="song-browser" aria-label="Song search">
    <div class="song-browser-heading"><strong>Songs</strong><button id="newSong" type="button">New</button></div>
    <span class="song-filter-wrap"><input id="songFilter" type="search" placeholder="Find songs" autocomplete="off" spellcheck="false" aria-controls="songFilterCandidates songList" aria-autocomplete="list" aria-expanded="false"><span id="songFilterCandidates" class="hanri-candidate-menu" role="listbox" aria-label="TLI song-search candidates" hidden></span></span>
    <div id="songList" class="song-list" role="listbox" aria-label="Matching songs" hidden></div>
  </section>
  <main class="song-editor-shell">
    <section class="song-form-panel">
      <form id="songForm">
        <div class="song-fields">
          <label class="tli-field">Song title
            <span class="tli-input-wrap"><input id="songTitle" required autocomplete="off" spellcheck="false" aria-controls="songTitleCandidates" aria-autocomplete="list"><span id="songTitleCandidates" class="hanri-candidate-menu" role="listbox" hidden></span></span>
          </label>
          <label>Mandarin title<input id="songMandarinTitle" required autocomplete="off"></label>
          <label>Mandarin title (Simplified)
            <span class="generated-title-field"><input id="songMandarinSimplifiedTitle" required autocomplete="off"><button id="regenerateMandarinSimplified" type="button">Regenerate</button></span>
          </label>
          <label>Alternative Mandarin title<input id="songMandarinAlternativeTitle" autocomplete="off" placeholder="Optional"></label>
          <label>Alternative Mandarin title (Simplified)
            <span class="generated-title-field"><input id="songMandarinAlternativeSimplifiedTitle" autocomplete="off" placeholder="Optional"><button id="regenerateMandarinAlternativeSimplified" type="button">Regenerate</button></span>
          </label>
          <label>Title annotation<select id="songTitleSystem"><option value="tli">TLI (Hangul ruby)</option><option value="zhuyin">Mandarin (Zhuyin ruby)</option></select></label>
          <label class="tli-field tli-title-field">TLI title <small>Select the intended reading for each Hanri word</small>
            <span class="tli-input-wrap"><input id="songTitleSource" required autocomplete="off" spellcheck="false" aria-controls="titleCandidates" aria-autocomplete="list"><span id="titleCandidates" class="hanri-candidate-menu" role="listbox" hidden></span></span>
          </label>
          <label class="tli-field tli-title-field">TLI title ruby <small>One Hangul reading per Hanri character; automatic readings use sandhi</small>
            <span class="generated-title-field"><input id="songTitleTliRuby" autocomplete="off" spellcheck="false" placeholder="애ˆ 졩 충 충"><button id="regenerateTitleTliRuby" type="button">Regenerate</button></span>
          </label>
          <label class="zhuyin-title-field" hidden>Zhuyin title reading <small>One spaced reading per title character</small><input id="songTitleZhuyin" autocomplete="off" spellcheck="false" placeholder="ㄍㄢˇ ㄕㄚˇ ㄍㄢˇ ㄔㄨㄥ"></label>
          <label class="zhuyin-title-field" hidden>Title Pinyin<input id="songTitlePinyin" autocomplete="off" spellcheck="false"></label>
          <label>YouTube link<input id="songVideo" type="url" required autocomplete="off"></label>
          <label>Category<select id="songCategory" required></select></label>
          <label class="route-field">Published route<input id="songRoute" readonly></label>
        </div>
        <div class="lyrics-heading"><div><h2>Lyrics</h2><span id="lineCount"></span></div></div>
        <div id="lyricRows" class="lyric-rows"></div>
      </form>
      <div class="song-actions"><button id="addLine" type="button">Add line</button><button id="previewSong" type="button">Refresh preview</button><button id="saveSong" type="button" class="primary">Save locally</button><button id="publishSong" type="button">Publish to GitHub</button><span id="songState"></span></div>
      <section id="publishProgress" class="publish-progress" hidden><strong id="publishStatus"></strong><pre id="publishLog"></pre></section>
    </section>
    <section class="song-preview-panel" aria-label="Song preview">
      <div class="panel-bar"><strong>Generated website preview</strong><a id="openSong" class="editor-hub-link" target="_blank" rel="noopener" hidden>Open built page</a></div>
      <iframe id="songPreview" title="Generated song preview" sandbox="allow-same-origin allow-scripts allow-presentation"></iframe>
    </section>
  </main>
</body>
</html>
