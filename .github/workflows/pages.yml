name: Deploy Tangliengim Website

# Documentation and agent notes are never published and no check reads them, so
# a push that only touches them skips the workflow. docs/*.json is not ignored:
# the Lomari check reads docs/lomari-review.json.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**/*.md"
      - "docs/*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**/*.md"
      - "docs/*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - ".claude/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  regression:
    name: Desktop and shared-engine regression (Windows)
    # The weekly scheduled run only exercises the Linux side check below; it
    # builds and deploys nothing, because build and deploy wait on this job.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run portable source release gate
        run: python -X utf8 tools/check_release.py --source-only

  # The same gate on Linux, as a side check that runs weekly (Mondays 03:00 UTC)
  # and on "Run workflow", not on pushes or pull requests: nothing waits for it,
  # and a failure (such as Ubuntu's package servers being unreachable) never
  # blocks a deploy.
  linux-regression:
    name: Shared-engine regression (Linux, side check)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Tk runtime
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y python3-tk
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run portable source release gate
        run: python -X utf8 tools/check_release.py --source-only

  build:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install portable Python build dependencies
        run: python -m pip install -r requirements-dev.txt
      # Opus copies are cached by each WAV's content and the encoder settings, so
      # only new recordings are encoded. The key changes with the WAVs and the
      # encoder settings; an older cache still restores and supplies unchanged files.
      - name: Restore encoded audio
        uses: actions/cache@v4
        with:
          path: .cache/audio-opus
          key: opus-${{ hashFiles('public/audio/**/*.wav', 'tools/compressed_audio.py') }}
          restore-keys: opus-
      - name: Confirm the portable ffmpeg can encode Opus
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools")
          import compressed_audio
          executable = compressed_audio.ffmpeg()
          assert executable, "No ffmpeg found; requirements-dev.txt installs imageio-ffmpeg."
          encoders = subprocess.run([executable, "-hide_banner", "-encoders"],
                                    capture_output=True, text=True, check=True).stdout
          assert " libopus " in encoders, f"{executable} has no libopus encoder."
          print(executable)
          PY
      - name: Build both interfaces from the canonical TSV
        run: python tools/build_site.py
      - name: Validate multilingual migration scope and preserved readings
        run: |
          python -m unittest discover -s tests -p test_wordpress_migration.py
          python -m unittest discover -s tests -p test_song_title_readings.py
          python -m unittest discover -s tests -p 'test_site_*.py'
      - name: Validate routes, shared resources, and audio
        run: python tools/check_site.py
      - name: Check compressed audio matches the WAV masters
        run: python tools/compressed_audio.py
      - name: Check built keyboard and sandhi integration
        run: node tools/check_web_apps.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # A normal publish takes about 20 seconds. Since November 2026 GitHub's
      # Pages service has sometimes left a deployment queued or syncing until
      # deploy-pages gives up at its fixed 10-minute maximum (a larger timeout
      # is ignored). The same artifact then publishes normally once GitHub
      # recovers, so wait and try once more instead of failing straight away.
      - name: Publish dictionary and IME together
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Wait for a stalled publish to clear
        if: steps.deployment.outcome == 'failure'
        run: sleep 600
      - name: Publish again after a stall
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
