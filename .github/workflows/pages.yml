name: Deploy Tangliengim Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  regression:
    name: Shared-engine regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Tk runtime on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run portable source release gate
        run: python -X utf8 tools/check_release.py --source-only

  build:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Python and Tkinter for the pronunciation engine
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python test dependencies (system Python; mirrors requirements-dev.txt)
        run: sudo apt-get install -y python3-fonttools python3-brotli python3-numpy
      - name: Install ffmpeg for the compressed audio copies
        run: sudo apt-get install -y ffmpeg
      - name: Build both interfaces from the canonical TSV
        run: python3 tools/build_site.py
      - name: Validate multilingual migration scope and preserved readings
        run: |
          python3 -m unittest discover -s tests -p test_wordpress_migration.py
          python3 -m unittest discover -s tests -p test_song_title_readings.py
          python3 -m unittest discover -s tests -p 'test_site_*.py'
      - name: Validate routes, shared resources, and audio
        run: python3 tools/check_site.py
      - name: Check compressed audio matches the WAV masters
        run: python3 tools/compressed_audio.py
      - name: Check built keyboard and sandhi integration
        run: node tools/check_web_apps.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # A normal publish takes about 20 seconds. Since November 2026 GitHub's
      # Pages service has sometimes left a deployment queued or syncing until
      # deploy-pages gives up at its fixed 10-minute maximum (a larger timeout
      # is ignored). The same artifact then publishes normally once GitHub
      # recovers, so wait and try once more instead of failing straight away.
      - name: Publish dictionary and IME together
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Wait for a stalled publish to clear
        if: steps.deployment.outcome == 'failure'
        run: sleep 600
      - name: Publish again after a stall
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
