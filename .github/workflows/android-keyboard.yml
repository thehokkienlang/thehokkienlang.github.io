name: Build Android Keyboard

# Builds the TLI keyboard APK with the current dictionary and engine, signed
# with the release key from the repository's Actions secrets, and attaches it
# to the run.
#
# Release: on main, when android/published-version.txt names a version that
# matches versionName in android/app/build.gradle and has no release yet, the
# APK is published as release android-v<version>, asset TLI-Keyboard.apk. The
# /ime/ page's download link points at the latest release's TLI-Keyboard.apk.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "data/**"
      - "shared/web-hangul-ime.js"
      - "shared/web-ime-core.js"
      - "shared/web-ime-menu.css"
      - "shared/web-punctuation.css"
      - "shared/web-hangul-font.css"
      - "shared/tli-sandhi.json"
      - "assets/fonts/**"
      - "tools/build_dictionary_json.py"
      - ".github/workflows/android-keyboard.yml"

permissions:
  contents: write # creating the release on main

concurrency:
  group: android-keyboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # The APK bundles public/data/hokkien-hanri-dict.json, which is generated
      # from data/hokkien_hanri_dict.tsv and not kept in git.
      - name: Build dictionary data
        run: python -X utf8 tools/build_dictionary_json.py
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.TLI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The TLI_KEYSTORE_BASE64 secret is missing; the APK cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # The runner image includes the Android SDK (ANDROID_HOME).
      - name: Build signed APK
        env:
          TLI_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TLI_KEYSTORE_PASSWORD: ${{ secrets.TLI_KEYSTORE_PASSWORD }}
          TLI_KEY_ALIAS: tli-keyboard
        run: gradle -p android assembleRelease --no-daemon
      - name: Name the APK
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TLI-Keyboard-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: TLI-Keyboard-${{ env.VERSION }}
          path: dist/*.apk
          retention-days: 30
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(tr -d '[:space:]' < android/published-version.txt)
          if [ "$published" != "$VERSION" ]; then
            echo "published-version.txt is $published, build is $VERSION: not releasing."
            exit 0
          fi
          tag="android-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          cp "dist/TLI-Keyboard-$VERSION.apk" dist/TLI-Keyboard.apk
          gh release create "$tag" dist/TLI-Keyboard.apk \
            --target "$GITHUB_SHA" --latest \
            --title "TLI Keyboard for Android $VERSION (test build)" \
            --notes "Android keyboard $VERSION. Built from $GITHUB_SHA with the current dictionary."
