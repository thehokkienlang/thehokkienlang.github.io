plugins {
    id "com.android.application"
}

// The keyboard runs the website's own IME code. These files are copied from the repository at
// build time, laid out like the site root, so there is one source for the engine and fonts.
def repo = rootProject.projectDir.parentFile
def webAssets = layout.buildDirectory.dir("generated/tliAssets")

def syncWebAssets = tasks.register("syncWebAssets", Sync) {
    into webAssets
    from(new File(repo, "shared")) {
        into "shared"
        include "web-hangul-ime.js", "web-ime-core.js", "web-ime-menu.css", "web-punctuation.css",
                "web-hangul-font.css"
    }
    from(new File(repo, "assets/fonts")) {
        into "assets/fonts"
        include "*.woff2"
    }
    // Generated by `python tools/build_site.py` (or build_dictionary_json.py); not in git.
    from(new File(repo, "public/data")) {
        into "public/data"
        include "hokkien-hanri-dict.json"
    }
    from(new File(rootProject.projectDir, "keyboard")) {
        into "keyboard"
    }
    doFirst {
        def dictionary = new File(repo, "public/data/hokkien-hanri-dict.json")
        if (!dictionary.isFile()) {
            throw new GradleException("Missing ${dictionary}: run `python tools/build_site.py` first.")
        }
    }
}

android {
    namespace "io.github.thehokkienlang.ime"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.thehokkienlang.ime"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.1.2"
    }

    sourceSets {
        main.assets.srcDir(webAssets)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Already compressed; storing them lets the WebView read them directly.
        noCompress += ["woff2"]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.named("preBuild") {
    dependsOn syncWebAssets
}
