<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Dictionary · TheHokkienLang</title>
    <meta
      name="description"
      content="Search Hanri, TLI Hangul, and Lomari pronunciations in TheHokkienLang dictionary."
    >
    <link rel="icon" type="image/png" href="/ime/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/shared/web-ime-menu.css">
    <link rel="stylesheet" href="/shared/web-site-navigation.css">
    <script src="/shared/web-site-language.js" defer></script>
    <script src="/shared/web-site-navigation.js" defer></script>
    <script src="gate.js" defer></script>
  </head>
  <body class="dictionary-locked" data-site-section="dictionary">
    <header class="site-app-header">
        __SITE_BRAND__
        <nav class="site-app-nav" aria-label="Main navigation">__SITE_NAVIGATION__</nav>
    </header>
    <h1 class="visually-hidden">Dictionary</h1>
    <main id="lockScreen" class="lock-screen">
      <section class="lock-panel" aria-label="Dictionary access">
        <p class="lock-note">This dictionary is currently available to invited visitors.</p>

        <form id="accessForm" class="access-form">
          <label for="passwordInput">Password</label>
          <input
            id="passwordInput"
            name="password"
            type="password"
            autocomplete="current-password"
            aria-describedby="accessError"
            required
            autofocus
          >
          <button id="enterDictionaryButton" type="submit">Enter dictionary</button>
          <p id="accessError" class="access-error" role="status" aria-live="polite" hidden>
            That password is not correct.
          </p>
        </form>
      </section>
    </main>

    <div id="dictionaryRoot" hidden></div>
  </body>
</html>
