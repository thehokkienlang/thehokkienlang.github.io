<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Hokkien Tangliengim Dictionary</title>
    <meta
      name="description"
      content="Search Hanri, Tangliengim Hangul, and Lomari pronunciations from the Hokkien Tangliengim dictionary data."
    >
    <link rel="icon" href="/assets/tangliengim-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="gate.js" defer></script>
  </head>
  <body class="dictionary-locked">
    <main id="lockScreen" class="lock-screen">
      <section class="lock-panel" aria-labelledby="lockTitle">
        <div class="lock-brand">
          <img class="lock-brand-mark" src="/assets/tangliengim-mark.svg" alt="" aria-hidden="true">
          <div>
            <p class="eyebrow">Hokkien Tangliengim</p>
            <h1 id="lockTitle">Dictionary</h1>
          </div>
        </div>

        <p class="lock-note">This dictionary is currently available to invited visitors.</p>

        <form id="accessForm" class="access-form">
          <label for="passwordInput">Password</label>
          <input
            id="passwordInput"
            name="password"
            type="password"
            autocomplete="current-password"
            aria-describedby="accessError"
            required
            autofocus
          >
          <button id="enterDictionaryButton" type="submit">Enter dictionary</button>
          <p id="accessError" class="access-error" role="status" aria-live="polite" hidden>
            That password is not correct.
          </p>
        </form>
      </section>
    </main>

    <div id="dictionaryRoot" hidden></div>
  </body>
</html>
